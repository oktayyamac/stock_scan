# Bu dosya repoda şu yolda durmalı: .github/workflows/scan.yml
name: Dusen Trend Kirilim Tarayici

on:
  schedule:
    # Hafta içi her 15 dakikada bir, 13:00-21:45 UTC arası (ABD seansını kapsar;
    # kış saatinde seans İstanbul 17:30-00:00). Seans dışındaki çalışmalar yeni mum bulamaz.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: # telefondan elle: Actions > Run workflow > mum aralığını seç
    inputs:
      interval:
        description: "Mum aralığı (15m, 5m, 30m, 1h, 1d)"
        default: "15m"

# Bir tarama bitmeden yenisi başlamasın
concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Aynı sinyali tekrar göndermemek için gönderilenler listesini sakla
      - uses: actions/cache@v4
        with:
          path: sent_signals.json
          key: sent-${{ github.run_id }}
          restore-keys: sent-

      - name: Tara ve Telegram'a gönder
        run: python scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTERVAL: ${{ github.event.inputs.interval || vars.INTERVAL || '15m' }}
